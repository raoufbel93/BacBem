<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة الغيابات - React</title>
    
    <!-- Fonts & CSS -->
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="absence_tracking.css">
    <link rel="stylesheet" href="../assets/css/mermaid.min.css">

    <!-- Node/Electron compatibility -->
    <script>
        if (typeof module === 'object') {
            window.module = module;
            module = undefined;
        }
        if (typeof exports === 'object') {
            window.exports = exports;
            exports = undefined;
        }
    </script>

    <!-- Legacy JS Libraries Needed for DB & Global Functions -->
    <script src="../assets/js/xlsx.full.min.js"></script>
    <script>
        if (window.module) module = window.module;
        if (window.exports) exports = window.exports;
    </script>
    
    <script src="../db.js"></script>
    <script src="../auth.js"></script>
    <script src="../core/academic-utils.js"></script>
    <script src="../core/storage.js"></script>
    <script src="../assets/js/subject_manager.js"></script>
    
    <script src="../assets/js/react-polyfills.js"></script>
    <script src="../assets/js/react.production.min.js"></script>
    <script src="../assets/js/react-dom.production.min.js"></script>

    <!-- Legacy Modals / UI logic that is still needed (Reports) -->
    <script src="absence_tracking.js"></script>

    <!-- React App Scripts -->
    <script src="absence_tracking_utils.js"></script>
    <script src="absence_tracking_hooks.js"></script>
    <script src="absence_tracking_students.js"></script>
    <script src="absence_tracking_teachers.js"></script>
    <script src="absence_tracking_supervisors.js"></script>
    <script src="absence_tracking_canteen_react.js"></script>
    <script src="absence_tracking_notes.js"></script>
    <script src="absence_tracking_modals.js"></script>
    <script src="absence_tracking_app.js"></script>
</head>
<body>
    <div id="app-root"></div>

    <!-- Report Container (for print) - Kept for legacy report generation -->
    <div class="report-container" id="reportContainer">
        <div class="report-page" id="reportPage">
            <!-- Report content will be generated by JS -->
        </div>
        <div class="no-print" style="text-align: center; margin-top: 20px;">
            <button class="btn btn-primary" onclick="window.print()">🖨️ طباعة التقرير</button>
            <button class="btn btn-danger" onclick="closeReport()">❌ إغلاق</button>
        </div>
    </div>
</body>
</html>

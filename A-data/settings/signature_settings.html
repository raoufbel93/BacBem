﻿<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات التوقيع - نظام إدارة المؤسسة</title>
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <script src="../db.js"></script>
    <script src="../auth.js"></script>
        <script>Auth.checkAuth();</script>
    <style>
        .settings-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .page-header p {
            color: #7f8c8d;
        }

        /* Signers Section */
        .signers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .signer-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-right: 4px solid var(--secondary-color);
        }

        .signer-card.supervisor {
            border-color: #27ae60;
        }

        .signer-card h3 {
            color: var(--primary-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        /* Reports Section */
        .reports-section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .reports-section h3 {
            color: var(--primary-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .reports-table {
            width: 100%;
            border-collapse: collapse;
        }

        .reports-table th,
        .reports-table td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }

        .reports-table th {
            background: var(--bg-color);
            font-weight: 700;
            color: var(--primary-color);
        }

        .reports-table tr:hover {
            background: var(--bg-color);
        }

        .reports-table select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            cursor: pointer;
            min-width: 120px;
        }

        .reports-table select:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        .checkbox-wrapper {
            display: flex;
            justify-content: center;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #27ae60;
        }

        /* Save Button */
        .save-section {
            margin-top: 25px;
            text-align: center;
        }

        .save-btn {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            padding: 15px 50px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(39, 174, 96, 0.3);
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.4);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #27ae60;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            display: none;
            animation: slideIn 0.3s ease;
            z-index: 9999;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>
    <script src="../assets/js/react-polyfills.js"></script>
    <script src="../assets/js/react.production.min.js"></script>
    <script src="../assets/js/react-dom.production.min.js"></script>
    <script src="../assets/js/navbar_manager.js"></script>
    <script src="../assets/js/icon_manager.js"></script>

    <div class="settings-container">
        <div class="page-header">
            <h1><span data-icon="edit"></span> إعدادات التوقيع</h1>
            <p>تحديد الممضي (المدير أو الناظر) لكل نوع تقرير</p>
        </div>

        <!-- Signers Section -->
        <div class="signers-grid">
            <!-- Director -->
            <div class="signer-card director">
                <h3><span data-icon="user"></span> المدير</h3>
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="directorName" placeholder="أدخل اسم المدير كاملاً">
                </div>
                <div class="form-group">
                    <label>الجنس</label>
                    <select id="directorGender"
                        style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit;">
                        <option value="male">ذكر (المدير)</option>
                        <option value="female">أنثى (المديرة)</option>
                    </select>
                </div>
            </div>

            <!-- Supervisor -->
            <div class="signer-card supervisor">
                <h3><span data-icon="user"></span> الناظر</h3>
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="supervisorName" placeholder="أدخل اسم الناظر كاملاً">
                </div>
                <div class="form-group">
                    <label>الجنس</label>
                    <select id="supervisorGender"
                        style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit;">
                        <option value="male">ذكر (الناظر)</option>
                        <option value="female">أنثى (الناظرة)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Reports Settings Section -->
        <div class="reports-section">
            <h3><span data-icon="list"></span> تحديد الممضي لكل تقرير</h3>
            <table class="reports-table">
                <thead>
                    <tr>
                        <th>التقرير</th>
                        <th>الممضي</th>
                        <th>إظهار التوقيع</th>
                    </tr>
                </thead>
                <tbody id="reportsTableBody">
                    <!-- Dynamically populated -->
                </tbody>
            </table>
        </div>

        <!-- Save Button -->
        <div class="save-section">
            <button class="save-btn" onclick="saveAllSettings()"><span data-icon="save"></span> حفظ جميع
                الإعدادات</button>
        </div>
    </div>

    <div id="toast" class="toast"><span data-icon="check-circle"></span> تم الحفظ بنجاح</div>

    <script src="../assets/js/sweetalert2.all.min.js"></script>
    <script src="signature_settings.js"></script>
    <script src="../assets/js/navbar_fix.js"></script>
    <script src="../assets/js/fullscreen_toggle.js"></script>
</body>

</html>

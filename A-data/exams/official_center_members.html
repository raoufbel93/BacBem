<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أعضاء المركز - الامتحانات الرسمية</title>
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <script>
        if (typeof module === 'object') {

    <script src="../assets/js/react-polyfills.js"></script>
    <script src="../assets/js/react.production.min.js"></script>
    <script src="../assets/js/react-dom.production.min.js"></script>
    <script src="../db.js"></script>
    <script src="../auth.js"></script>
    <script src="../assets/js/navbar_manager.js"></script>
    <script src="../assets/js/navbar_fix.js"></script>
    <script>
        if (window.module) module = window.module;

    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => Auth.checkAuth());
    </script>
    <style>
        body { background: var(--bg-color); }
        .page-shell { max-width: 1280px; margin: 0 auto; padding: 20px; }
        .page-header {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff; padding: 18px 24px; border-radius: 18px; margin-bottom: 24px;
            display: flex; align-items: center; gap: 16px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.18);
        }
        .page-header .header-icon {
            width: 58px; height: 58px; border-radius: 18px; background: rgba(255,255,255,0.12);
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.18);
        }
        .page-header h1 { margin: 0; font-size: 1.5rem; font-weight: 900; }
        .page-header p { margin: 4px 0 0; color: #cbd5e1; font-weight: 600; }
        .layout-grid { display: grid; grid-template-columns: 360px 1fr; gap: 22px; }
        .panel {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
        }
        .panel-head {
            padding: 16px 18px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center;
            justify-content: space-between; gap: 10px;
        }
        .panel-head h3 { margin: 0; color: var(--primary-color); font-size: 1rem; font-weight: 900; }
        .panel-body { padding: 18px; }
        .stats-strip {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 18px;
        }
        .stat-card {
            background: linear-gradient(180deg, var(--bg-color), var(--card-bg));
            border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; text-align: center;
        }
        .stat-card .num { font-size: 1.8rem; font-weight: 900; color: var(--secondary-color); }
        .stat-card .lbl { color: var(--text-muted); font-size: 0.85rem; font-weight: 700; }
        .field { margin-bottom: 14px; }
        .field label { display: block; margin-bottom: 6px; color: var(--primary-color); font-weight: 800; font-size: 0.88rem; }
        .field input, .field textarea {
            width: 100%; border: 1px solid var(--border-color); border-radius: 12px; padding: 11px 13px;
            background: var(--bg-color); color: var(--primary-color); font-family: inherit; font-size: 0.92rem;
        }
        .field textarea { min-height: 92px; resize: vertical; }
        .field input:focus, .field textarea:focus {
            outline: none; border-color: var(--secondary-color); box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
        }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            border: none; border-radius: 12px; padding: 11px 16px; font-family: inherit; font-weight: 800;
            cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: #2563eb; color: #fff; box-shadow: 0 8px 18px rgba(37,99,235,0.2); }
        .btn-secondary { background: var(--bg-color); color: var(--primary-color); border: 1px solid var(--border-color); }
        .search-box {
            width: 100%; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 14px;
            background: var(--bg-color); color: var(--primary-color); margin-bottom: 16px; font-family: inherit;
        }
        .members-table { width: 100%; border-collapse: collapse; }
        .members-table th, .members-table td {
            padding: 12px 10px; border-bottom: 1px solid var(--border-color); text-align: center; vertical-align: middle;
        }
        .members-table th { background: var(--surface-2); color: var(--primary-color); font-weight: 900; }
        .members-table td.name-cell { text-align: right; font-weight: 800; color: var(--primary-color); }
        .members-table td.note-cell { text-align: right; color: var(--text-muted); font-size: 0.88rem; }
        .table-actions { display: flex; gap: 8px; justify-content: center; }
        .table-btn {
            width: 34px; height: 34px; border: none; border-radius: 10px; cursor: pointer; color: #fff;
        }
        .table-btn.edit { background: #0ea5e9; }
        .table-btn.delete { background: #ef4444; }
        .empty-state { padding: 36px 18px; text-align: center; color: var(--text-muted); font-weight: 700; }
        @media (max-width: 980px) {
            .layout-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>
    <div id="root"></div>

    <script src="../assets/js/sweetalert2.all.min.js"></script>
    <script src="official_center_members_react.js"></script>
</body>

</html>

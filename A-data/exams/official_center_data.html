<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات المركز - الامتحانات الرسمية</title>
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <script src="../assets/js/react-polyfills.js"></script>
    <script src="../assets/js/react.production.min.js"></script>
    <script src="../assets/js/react-dom.production.min.js"></script>
    <script src="../db.js"></script>

    <script src="../assets/js/icon_manager.js"></script>
    <script src="../assets/js/navbar_manager.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => Auth.checkAuth());
    </script>
    <style>
        .page-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 15px 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-header .header-icon {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            color: white;
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0;
            color: #fff;
        }

        .page-header p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin: 4px 0 0 0;
            font-weight: 500;
        }

        .center-data-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 10px;
        }

        .form-section {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .bac-streams-box {
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-color);
        }

        .bac-streams-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .bac-streams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .bac-stream-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .bac-stream-chip:hover {
            border-color: var(--secondary-color);
            transform: translateY(-1px);
        }

        .bac-stream-chip.is-selected {
            border-color: var(--secondary-color);
            background: rgba(52, 152, 219, 0.08);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.08);
        }

        .bac-stream-chip input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: var(--secondary-color);
        }

        .form-actions {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .btn-submit {
            background: #27ae60;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: #219a52;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }
        
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            z-index: 10;
        }
        html[data-theme="dark"] .loading-overlay {
            background: rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* Dark Mode */
        html[data-theme="dark"] .page-header {
            background: linear-gradient(135deg, #0f172a, #020617);
            border: 1px solid #1e293b;
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>

    <div id="root"></div>

    <!-- Scripts -->
    <script src="../assets/js/sweetalert2.all.min.js"></script>
    <script src="official_center_data_react.js?v=4"></script>

</body>

</html>

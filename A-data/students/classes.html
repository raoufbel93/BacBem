<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسيير الأفواج - تحليل النتائج</title>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
        <script src="../db.js"></script>
    <script src="../auth.js"></script>
    <script>
    </script>
    <style>
        :root {
            --primary-color: var(--secondary-color);
            --secondary-color: #2980b9;
            --accent-color: #e67e22;
            --bg-light: var(--bg-color);
            --text-dark: var(--primary-color);
        }

        body {
            background-color: var(--bg-light);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 { /* Premium header styles are inline */ }

        /* Controls Card Redesign */
        .controls-card {
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .filters-group {
            display: flex;
            gap: 20px;
            align-items: center;
            flex: 1;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }

        .control-group label {
            font-weight: bold;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        select {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            transition: border-color 0.3s;
            background-color: var(--card-bg);
        }

        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .btn-action {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            background: var(--accent-color);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        /* Stats Card Redesign */
        .stats-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            display: none;
            /* Hidden by default */
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .stat-box {
            background: var(--card-bg);
            border: 1px solid #eaeaea;
            border-radius: 10px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .stat-box.g1 {
            border-top: 5px solid #2980b9;
        }

        .stat-box.g2 {
            border-top: 5px solid #c0392b;
        }

        .stat-box.all {
            border-top: 5px solid #7f8c8d;
            background: #fdfdfd;
        }

        .stat-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #555;
            padding: 4px 0;
            border-bottom: 1px dashed #f5f5f5;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-value {
            font-weight: bold;
            color: var(--primary-color);
        }

        /* Table Styles */
        .data-table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            padding: 5px;
        }

        .data-table thead th {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            font-weight: 500;
        }

        /* Sub-group Column */
        .group-cell {
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.2s;
            user-select: none;
        }

        .group-cell:hover {
            filter: brightness(0.95);
            transform: scale(1.02);
        }

        .group-1 {
            background-color: #d6eaf8;
            /* Light Blue */
            color: #2980b9;
        }

        .group-2 {
            background-color: #fadbd8;
            /* Light Red */
            color: #c0392b;
        }

        html[data-theme="dark"] .stat-box {
            background: var(--card-bg);
            border-color: var(--border-color);
        }

        html[data-theme="dark"] .stat-box.all {
            background: var(--surface-3);
        }

        html[data-theme="dark"] .stat-header {
            color: var(--heading-color);
            border-bottom-color: var(--border-color);
        }

        html[data-theme="dark"] .stat-row {
            color: var(--text-muted);
            border-bottom-color: rgba(148, 163, 184, 0.2);
        }

        html[data-theme="dark"] .group-cell.group-1 {
            background-color: rgba(59, 130, 246, 0.18);
            color: #93c5fd;
        }

        html[data-theme="dark"] .group-cell.group-2 {
            background-color: rgba(248, 113, 113, 0.18);
            color: #fca5a5;
        }

        html[data-theme="dark"] #currentYearBadge {
            background: var(--surface-3) !important;
            border-color: var(--border-color) !important;
            color: var(--text-color) !important;
        }

        html[data-theme="dark"] .data-table thead th[style*="#fff3cd"] {
            background-color: rgba(245, 158, 11, 0.2) !important;
            color: #fcd34d !important;
        }

        html[data-theme="dark"] .data-table tbody td {
            background-color: transparent !important;
        }
    </style>
    <script>Auth.checkAuth();</script>
</head>

<body>

    <div id="navbar-container"></div>
    <script src="../assets/js/react-polyfills.js"></script>
    <script src="../assets/js/react.production.min.js"></script>

    <!-- Extra CSS for UI consistency -->
    <style>
        .premium-stats-widget {
            display: flex; align-items: center; gap: 10px;
            background: var(--card-bg); padding: 3px 12px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); border: 1px solid #eef2f7;
            height: 38px; margin-bottom: 0; z-index: 10;
        }
    </style>

    <div class="container-fluid px-4 py-3 animate-fade-in-up">
        <header class="dashboard-header align-items-center mb-4 no-print" style="padding: 20px 32px; border-radius: 16px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; display: flex; justify-content: space-between; overflow: hidden; position: relative;">
            <div style="position: relative; z-index: 1;">
                <h1 style="margin: 0; font-size: 2rem; font-weight: 800; display: flex; align-items: center; gap: 12px;"><i class="fas fa-users-cog text-primary"></i> تسيير الأفواج التربوية</h1>
                <p style="margin: 8px 0 0 0; color: #cbd5e1; font-size: 1.1rem;">أداة ذكية لتوزيع وتسيير أفواج التلاميذ بطريقة متوازنة</p>
            </div>
            <div style="position: absolute; top: -50%; right: -10%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%); filter: blur(30px); pointer-events: none;"></div>
        </header>

        <!-- Filter Card -->
        <div class="card shadow-sm mb-3 no-print">
            <div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
                <h6 class="mb-0 text-muted"><i class="fas fa-filter me-2"></i> خيارات التسيير <span id="currentYearBadge" class="badge bg-light text-dark border ms-2" style="font-weight: 600;"></span></h6>
            </div>
            <div class="card-body">
                <div class="row g-3 align-items-center flex-wrap">
                    <div style="width: 17%;">
                        <div class="input-group input-group-sm" dir="ltr">
                            <select id="levelSelect" class="form-select text-end" dir="rtl">
                                <option value="">-- المستويات --</option>
                            </select>
                            <span class="input-group-text bg-light"><i class="fas fa-layer-group"></i></span>
                        </div>
                    </div>
                    <div style="width: 17%; display: none;" id="streamFilterContainer">
                        <div class="input-group input-group-sm" dir="ltr">
                            <select id="streamSelect" class="form-select text-end" dir="rtl">
                                <option value="">-- الشعب --</option>
                            </select>
                            <span class="input-group-text bg-light"><i class="fas fa-stream"></i></span>
                        </div>
                    </div>
                    <div style="width: 17%;">
                        <div class="input-group input-group-sm" dir="ltr">
                            <select id="classSelect" class="form-select text-end" dir="rtl">
                                <option value="">-- الأقسام --</option>
                            </select>
                            <span class="input-group-text bg-light"><i class="fas fa-chalkboard"></i></span>
                        </div>
                    </div>

                    <div class="col d-flex gap-2 justify-content-end align-items-center">
                        <button class="btn btn-outline-success btn-sm px-3 shadow-sm d-flex align-items-center" id="autoGroupBtn" onclick="autoGroup()" title="خيارات تفويج التلاميذ">
                            <i class="fas fa-magic me-1"></i> خيارات التفويج
                        </button>
                        <button class="btn btn-outline-success btn-sm px-3 shadow-sm d-flex align-items-center" onclick="exportClassesToExcel()" title="تصدير القائمة إلى Excel">
                            <i class="fas fa-file-excel me-1"></i> تصدير Excel
                        </button>

                        <div class="dropdown">
                            <button class="btn btn-primary btn-sm px-4 shadow-sm dropdown-toggle" type="button" id="printDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-print me-1"></i> طباعة
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" aria-labelledby="printDropdown">
                                <li><a class="dropdown-item" href="#" onclick="printClasses('combined'); return false;"><i class="fas fa-list me-2 text-muted"></i> طباعة مجمعة (الكل)</a></li>
                                <li><a class="dropdown-item" href="#" onclick="printClasses('groups'); return false;"><i class="fas fa-users me-2 text-muted"></i> طباعة مفصلة (أفواج)</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Stats Area Restored -->
        <div class="row g-3 mb-4" id="statsCard" style="display: none;">
            <!-- Total Small Card (Now on the Right) -->
            <div class="col-4">
                <div class="card border-0 shadow-sm" style="border-right: 4px solid #1e293b !important;">
                    <div class="card-body p-2 d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-dark bg-opacity-10 p-2 me-2 d-flex align-items-center justify-content-center" style="width:32px; height:32px;">
                                <i class="fas fa-chart-bar text-dark" style="font-size: 0.8rem;"></i>
                            </div>
                            <div style="line-height: 1.1;">
                                <span class="d-block text-muted fw-bold" style="font-size: 0.7rem;">تعداد القسم</span>
                                <span class="fw-bold text-dark" id="all-total" style="font-size: 0.9rem;">-</span>
                            </div>
                        </div>
                        <div class="d-flex gap-1">
                            <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 py-1 px-2" style="font-size: 0.7rem;"><i class="fas fa-male me-1"></i><span id="all-m">-</span></span>
                            <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 py-1 px-2" style="font-size: 0.7rem;"><i class="fas fa-female me-1"></i><span id="all-f">-</span></span>
                            <span class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-10 py-1 px-2" style="font-size: 0.7rem;"><i class="fas fa-redo me-1"></i><span id="all-r">-</span></span>
                            <span id="all-mf" style="display:none;"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Group 1 Small Card -->
            <div class="col-4">
                <div class="card border-0 shadow-sm" style="border-right: 4px solid #2980b9 !important;">
                    <div class="card-body p-2 d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-primary bg-opacity-10 p-2 me-2 d-flex align-items-center justify-content-center" style="width:32px; height:32px;">
                                <i class="fas fa-users text-primary" style="font-size: 0.8rem;"></i>
                            </div>
                            <div style="line-height: 1.1;">
                                <span class="d-block text-muted fw-bold" style="font-size: 0.7rem;">الفوج 1</span>
                                <span class="fw-bold text-dark" style="font-size: 0.9rem;"><span id="g1-total">-</span> <small class="text-muted fw-normal" style="font-size: 0.65rem;">من <span id="g1-class-total">-</span></small></span>
                            </div>
                        </div>
                        <div class="d-flex gap-1">
                            <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 py-1 px-2" style="font-size: 0.7rem;"><i class="fas fa-male me-1"></i><span id="g1-m">-</span></span>
                            <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 py-1 px-2" style="font-size: 0.7rem;"><i class="fas fa-female me-1"></i><span id="g1-f">-</span></span>
                            <span class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-10 py-1 px-2" style="font-size: 0.7rem;"><i class="fas fa-redo me-1"></i><span id="g1-r">-</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Group 2 Small Card -->
            <div class="col-4">
                <div class="card border-0 shadow-sm" style="border-right: 4px solid #c0392b !important;">
                    <div class="card-body p-2 d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-danger bg-opacity-10 p-2 me-2 d-flex align-items-center justify-content-center" style="width:32px; height:32px;">
                                <i class="fas fa-users text-danger" style="font-size: 0.8rem;"></i>
                            </div>
                            <div style="line-height: 1.1;">
                                <span class="d-block text-muted fw-bold" style="font-size: 0.7rem;">الفوج 2</span>
                                <span class="fw-bold text-dark" style="font-size: 0.9rem;"><span id="g2-total">-</span> <small class="text-muted fw-normal" style="font-size: 0.65rem;">من <span id="g2-class-total">-</span></small></span>
                            </div>
                        </div>
                        <div class="d-flex gap-1">
                            <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 py-1 px-2" style="font-size: 0.7rem;"><i class="fas fa-male me-1"></i><span id="g2-m">-</span></span>
                            <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 py-1 px-2" style="font-size: 0.7rem;"><i class="fas fa-female me-1"></i><span id="g2-f">-</span></span>
                            <span class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-10 py-1 px-2" style="font-size: 0.7rem;"><i class="fas fa-redo me-1"></i><span id="g2-r">-</span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Data Table Card -->
        <div class="card shadow-sm table-card">
            <div class="card-body p-0">
                <div class="table-responsive" style="margin-bottom: 0px;">

            <table class="data-table table table-hover" style="margin-bottom: 0px; border: none;">
                <thead>
                    <tr>
                        <th width="5%">#</th>
                        <th width="25%">اللقب</th>
                        <th width="25%">الاسم</th>
                        <th width="10%">الجنس</th>
                        <th width="10%">تاريخ الميلاد</th>
                        <th width="10%">معيد</th>
                        <th width="15%" style="background-color: #fff3cd; color: var(--primary-color);">الفوج الفرعي</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <!-- Rows -->
                </tbody>
            </table>
        </div>
            </div>
        </div>
    </div>

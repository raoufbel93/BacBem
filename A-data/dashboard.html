<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القيادة - إدارتي+</title>
    <script>
        (function () {
            var theme = 'light';
            var themePreset = 'default';
            try {
                theme = localStorage.getItem('theme') || 'light';
                themePreset = localStorage.getItem('themePreset') || 'default';
            } catch (e) { }
            document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme-preset', themePreset || 'default');
        })();
    </script>
    <script src="assets/js/chart.js"></script>
    <!-- Bootstrap CSS (Local) -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <!-- FontAwesome (Local) -->
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Cairo Font (Local) -->
    <script src="auth.js"></script>
    <script src="assets/js/lucide.min.js"></script>
    <script src="assets/js/icon_manager.js"></script>
    <script>
        Auth.checkAuth();
    </script>

    <script src="assets/js/update_manager.js"></script>
    <script src="assets/js/profile_check.js"></script>
    <script src="db.js"></script>
    <script src="core/academic-utils.js"></script>
    <script src="core/ui-utils.js"></script>
    <script src="core/storage.js"></script>
    <style>
        /* Impeccable Design Tokens */
        /* Design Tokens moved to base.css */

        body {
            font-family: "Cairo", sans-serif !important;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            padding-top: 55px !important;
        }

        

        html[data-theme="dark"] .container {
            background-color: transparent !important;
        }

        /* Let the dashboard use the full iframe width on large screens */
        .dashboard-container {
            width: 100%;
            max-width: calc(100vw - 20px);
            padding-left: 10px;
            padding-right: 10px;
        }

        /* Override global shell-mode spacing for dashboard specifically */
        body.shell-mode {
            padding-top: 55px !important;
            margin: 0 !important;
        }

        /* Dashboard Header */
        .dashboard-header {
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            color: var(--card-bg);
            padding: 24px 32px;
            /* Reduced padding */
            border-radius: var(--radius-xl);
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #1e293b;
            border-right: 5px solid #3b82f6;
            /* Distinctive semantic highlight */
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dashboard-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            /* Delightful hover feedback */
        }

        /* Dark mode compatibility for header */
        html[data-theme="dark"] .dashboard-header {
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%) !important;
            border-color: #1e293b !important;
            border-right-color: #6366f1 !important;
            /* Indigo accent in dark mode */
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
        }

        /* Subtle texture for header */
        .dashboard-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.08) 0%, transparent 100%);
            pointer-events: none;
        }

        .dashboard-header h1 {
            color: var(--card-bg);
            margin: 0;
            font-size: 1.75rem;
            /* Reduced from 2rem */
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .dashboard-header h2 {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin: 8px 0 0 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .academic-year-badge {
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            padding: 8px 18px;
            border-radius: 100px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: inline-flex;
            align-items: center;
            position: relative;
            z-index: 1;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .academic-year-badge:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        html[data-theme="dark"] .academic-year-badge {
            background: rgba(255, 255, 255, 0.08) !important;
            color: #f1f5f9 !important;
            border-color: rgba(255, 255, 255, 0.15) !important;
        }

        #versionBadge {
            font-size: 0.85rem;
            background: rgba(245, 158, 11, 0.15);
            /* Warm amber tint on dark */
            padding: 6px 14px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fcd34d;
            /* Light bright amber */
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            position: relative;
            z-index: 1;
        }

        #versionBadge:hover {
            background: rgba(245, 158, 11, 0.25);
            color: #fde68a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }

        html[data-theme="dark"] #versionBadge {
            background: rgba(245, 158, 11, 0.15) !important;
            color: #fcd34d !important;
            border-color: rgba(245, 158, 11, 0.3) !important;
        }

        html[data-theme="dark"] #versionBadge:hover {
            background: rgba(245, 158, 11, 0.25) !important;
            color: #fde68a !important;
            border-color: rgba(245, 158, 11, 0.4) !important;
        }

        /* Trial Mode Notice - Toast format */
        #trialNotice {
            position: fixed;
            bottom: 24px;
            left: 24px;
            right: auto;
            background-color: var(--color-slate-900);
            color: var(--color-slate-50);
            padding: 16px 24px;
            border-radius: var(--radius-md);
            z-index: 9999;
            box-shadow: var(--shadow-float);
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            font-size: 0.95rem;
            border: 1px solid var(--color-slate-700);
            border-right: 4px solid var(--color-warning);
            max-width: 450px;
            animation: slideInLeft 0.5s var(--ease-out-quart) forwards;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        #trialNotice i {
            color: var(--color-warning);
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        #trialNotice span {
            flex-grow: 1;
            line-height: 1.4;
        }

        #trialNotice a {
            background-color: var(--color-warning);
            color: var(--color-slate-900);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
            transition: all 0.2s var(--ease-out-quart);
            will-change: transform;
        }

        #trialNotice a:hover {
            background-color: #d97706;
            transform: scale(1.03);
        }

        /* Sections */
        .section-title {
            font-size: 1.25rem;
            color: var(--color-slate-800);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        /* Quick Links */
        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .quick-link-card {
            background: var(--card-bg);
            padding: 18px 18px 16px;
            border-radius: var(--radius-lg);
            text-decoration: none;
            color: var(--text-color);
            box-shadow: var(--shadow-sm);
            transition: all 0.4s var(--ease-out-quint);
            border: 1px solid rgba(148, 163, 184, 0.22);
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 148px;
            overflow: hidden;
            will-change: transform, box-shadow, border-color, color;
        }

        .quick-link-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-float);
            border-color: color-mix(in srgb, var(--quick-link-accent, var(--color-brand)) 60%, white);
            color: var(--heading-color);
        }

        .quick-link-card-enhanced::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top left, var(--quick-link-glow, rgba(37, 99, 235, 0.16)), transparent 34%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 58%);
            opacity: 0.9;
            pointer-events: none;
        }

        .quick-link-card-glow {
            position: absolute;
            inset: auto -20% -40% auto;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, var(--quick-link-glow, rgba(37, 99, 235, 0.22)) 0%, transparent 70%);
            filter: blur(18px);
            opacity: 0.9;
            pointer-events: none;
        }

        .quick-link-card-top {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .quick-link-card .icon-wrapper {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(241, 245, 249, 0.88));
            color: var(--quick-link-accent, var(--color-brand));
            border: 1px solid rgba(255, 255, 255, 0.42);
            box-shadow: 0 12px 22px rgba(15, 23, 42, 0.1);
            transition: all 0.4s var(--ease-out-quint);
            will-change: transform, background-color, color, border-color;
        }

        .quick-link-arrow {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-soft);
            background: rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(148, 163, 184, 0.16);
            transition: all 0.35s var(--ease-out-quint);
        }

        .quick-link-copy {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: right;
            gap: 8px;
        }

        .quick-link-card:focus-visible {
            outline: 2px solid var(--color-blue-500);
            outline-offset: 2px;
        }

        .quick-link-card:hover .icon-wrapper {
            transform: translateY(-2px) scale(1.05);
            background: linear-gradient(180deg, rgba(255, 255, 255, 1), rgba(239, 246, 255, 0.92));
            color: var(--quick-link-accent, var(--color-brand));
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 16px 28px rgba(15, 23, 42, 0.14);
        }

        .quick-link-card:hover .quick-link-arrow {
            color: var(--quick-link-accent, var(--color-brand));
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            transform: translate(-2px, 2px);
        }

        .quick-link-card .title {
            font-weight: 800;
            font-size: 1rem;
            color: var(--heading-color);
            transition: color 0.4s var(--ease-out-quint);
        }

        .quick-link-card .subtitle {
            font-size: 0.8rem;
            line-height: 1.55;
            color: var(--text-muted);
            font-weight: 700;
        }

        html[data-theme="dark"] .quick-link-card {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.94), rgba(11, 18, 32, 0.98));
            border-color: rgba(148, 163, 184, 0.24);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
        }

        html[data-theme="dark"] .quick-link-card:hover {
            border-color: color-mix(in srgb, var(--quick-link-accent, #60a5fa) 60%, #e2e8f0);
            box-shadow: 0 20px 38px rgba(0, 0, 0, 0.4);
        }

        html[data-theme="dark"] .quick-link-card .icon-wrapper {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(226, 232, 240, 0.9));
            box-shadow: 0 14px 24px rgba(2, 6, 23, 0.26);
        }

        html[data-theme="dark"] .quick-link-card .title {
            color: #f8fafc;
        }

        html[data-theme="dark"] .quick-link-card .subtitle {
            color: #94a3b8;
        }

        html[data-theme="dark"] .quick-link-arrow {
            background: rgba(148, 163, 184, 0.08);
            border-color: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
        }

        @media (max-width: 600px) {
            .quick-link-card {
                min-height: 132px;
                padding: 16px;
            }

            .quick-link-card .icon-wrapper {
                width: 52px;
                height: 52px;
            }

            .quick-link-card .title {
                font-size: 0.92rem;
            }

            .quick-link-card .subtitle {
                font-size: 0.76rem;
            }
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            /* Reduced padding */
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 16px;
            /* Reduced gap */
            transition: all 0.3s var(--ease-out-quart);
            border: 1px solid var(--color-slate-200);
            will-change: transform, box-shadow;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            /* Quieter elevation */
            box-shadow: var(--shadow-md);
            border-color: var(--color-brand);
            /* Bolder interaction indicator */
        }

        .stat-icon {
            width: 48px;
            /* Reduced size */
            height: 48px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            /* Reduced font size */
            flex-shrink: 0;
            transition: transform 0.4s var(--ease-out-quint);
            will-change: transform;
        }

        .stat-card:hover .stat-icon {
            transform: scale(1.04);
            /* Removed rotate(5deg) for quieter Polish */
        }

        .stat-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-info h3 {
            font-size: 0.8rem;
            /* Reduced size */
            color: var(--color-slate-500);
            margin-bottom: 2px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-info p {
            font-size: 1.75rem;
            /* Reduced from 2.25rem */
            font-weight: 900;
            color: var(--color-slate-900);
            margin: 0;
            line-height: 1;
            letter-spacing: -1px;
        }

        /* Disciplinary Box Refinement */
        .disc-box {
            background: var(--card-bg);
            padding: 20px;
            /* Reduced from 24px */
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-slate-200);
            margin-bottom: 32px;
        }

        .disc-box .stat-card {
            box-shadow: none;
            border: 1px solid var(--color-slate-100);
            background-color: var(--color-slate-50);
            padding: 16px;
            /* Reduced from 20px */
            margin-bottom: 0;
            height: 100%;
            /* For consistent heights */
        }

        .disc-box .stat-card:hover {
            background-color: var(--card-bg);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            border-color: var(--color-slate-200);
        }

        /* Charts Row */
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }

        .chart-box {
            background: var(--card-bg);
            padding: 24px;
            /* Reduced padding from 32px */
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-slate-200);
            transition: box-shadow 0.4s var(--ease-out-quint), border-color 0.4s var(--ease-out-quint);
            margin-bottom: 24px;
        }

        .chart-box:hover {
            border-color: var(--color-slate-300);
            box-shadow: var(--shadow-lg);
        }

        .chart-wrapper {
            height: 320px;
            position: relative;
            width: 100%;
        }

        /* Levels Grid */
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .level-card {
            background-color: var(--color-slate-50);
            padding: 20px;
            border-radius: var(--radius-md);
            text-align: center;
            border: 1px solid var(--color-slate-200);
            transition: all 0.3s var(--ease-out-quart);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .level-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--color-brand);
            background-color: var(--card-bg);
        }

        .level-card h4 {
            font-size: 0.9rem;
            color: var(--color-slate-500);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .level-card .count {
            font-size: 2rem;
            font-weight: 900;
            color: var(--color-slate-900);
            margin: 4px 0;
            line-height: 1;
        }

        .level-card .gender {
            font-size: 0.8rem;
            color: var(--color-slate-500);
            margin-top: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* Essential Animation Classes */
        .animate-fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.6s var(--ease-out-quart) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stagger-1 {
            animation-delay: 0.05s;
        }

        .stagger-2 {
            animation-delay: 0.10s;
        }

        .stagger-3 {
            animation-delay: 0.15s;
        }

        .stagger-4 {
            animation-delay: 0.20s;
        }

        .stagger-5 {
            animation-delay: 0.25s;
        }

        .stagger-6 {
            animation-delay: 0.30s;
        }

        .stagger-7 {
            animation-delay: 0.35s;
        }

        /* Lucide Details */
        i[data-lucide] {
            width: 1em;
            height: 1em;
        }

        @keyframes lucide-spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .lucide-spin {
            animation: lucide-spin 1s linear infinite;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .charts-row {
                grid-template-columns: 1fr;
            }

            .levels-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .quick-links {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                padding: 24px;
            }

            .dashboard-header .text-right,
            .dashboard-header .text-left {
                text-align: right !important;
                align-items: flex-start !important;
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .dashboard-container {
                max-width: 100%;
                padding-left: 10px;
                padding-right: 10px;
            }
        }

        /* Dark mode styles removed, now using CSS variables in base.css */
    </style>

</head>

<body>

    <div id="navbar-container"></div>
    <script>window.IS_ROOT_PAGE = false; window.IS_SUB_PAGE = true;</script>
    <script src="assets/js/react-polyfills.js"></script>
    <script src="assets/js/react.production.min.js"></script>
    <script src="assets/js/react-dom.production.min.js"></script>
    <script src="assets/js/navbar_manager.js"></script>

    <div class="container dashboard-container">
        <!-- React renders the entire dashboard here -->
        <div id="dashboard-root"></div>
    </div>

    <!-- Bootstrap JS (Local) -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/navbar_fix.js"></script>
    <script src="assets/js/sweetalert2.all.min.js"></script>
    <script src="assets/js/theme_manager.js"></script>
    <script src="dashboard_react.js"></script>
    <script src="assets/js/fullscreen_toggle.js"></script>
</body>

</html>

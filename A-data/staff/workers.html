<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العمال - نظام التحليل التربوي</title>
    <script>

    <script>
        if (window.module) module = window.module;
        if (window.exports) exports = window.exports;

    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style.css">
    <script src="../db.js"></script>
    <script src="../auth.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/icon_manager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof IconManager !== 'undefined') IconManager.render();
        });
    </script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --premium-dark: #0f172a;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            background: radial-gradient(circle at top right, #f8fafc, #f1f5f9);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif !important;
            min-height: 100vh;
        }

        .main-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            padding: 30px;
            margin-bottom: 40px;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 0, 0, 0.03);
            padding: 20px 25px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            flex-direction: row-reverse;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: var(--accent-red);
        }

        .stat-icon-wrapper {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            transition: all 0.3s ease;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-info .number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--premium-dark);
            display: block;
            line-height: 1.2;
        }

        .stat-info .label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* Search & Filter */
        .search-filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            border: 1px solid rgba(0, 0, 0, 0.02);
            align-items: center;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px !important;
            padding: 12px 18px !important;
            padding-right: 40px !important;
            font-weight: 600 !important;
            color: var(--text-main) !important;
            transition: all 0.3s ease !important;
        }

        .search-box input:focus {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1) !important;
            outline: none;
        }

        /* Table */
        .workers-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .workers-table thead th {
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-weight: 700;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .workers-table tbody td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
        }

        .workers-table thead th:nth-child(3),
        .workers-table tbody td:nth-child(3) {
            text-align: right;
        }

        .workers-table tbody tr:not(.category-header):hover {
            background-color: var(--bg-color);
        }

        .workers-table tbody tr.category-header td {
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .workers-table tbody tr:last-child td {
            border-bottom: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.4;
        }

        .empty-state h4 {
            font-weight: 700;
            margin-bottom: 8px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
        }

        .modal-overlay.active {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            max-width: 500px;
            width: 90%;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            background: var(--bg-color);
            padding: 25px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-weight: 800;
            color: var(--premium-dark);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #ef4444;
        }

        .modal-body {
            padding: 30px;
            max-height: 60vh;
            overflow-y: auto;
        }

        /* Custom scrollbar for modal */
        .modal-body::-webkit-scrollbar {
            width: 8px;
        }

        .modal-body::-webkit-scrollbar-track {
            background: var(--bg-color);
            border-radius: 4px;
        }

        .modal-body::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .modal-body::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .modal-buttons {
            padding: 20px 30px;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .form-group-custom {
            margin-bottom: 20px;
        }

        .form-group-custom label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .form-group-custom input,
        .form-group-custom select {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            font-weight: 600;
            color: var(--primary-color);
            background: var(--bg-color);
            transition: all 0.2s;
        }

        .form-group-custom input:focus,
        .form-group-custom select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            outline: none;
        }

        /* Buttons */
        .btn {
            border-radius: 12px !important;
            padding: 10px 20px !important;
            font-weight: 700 !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            border: none !important;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb) !important;
            color: white !important;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            color: white !important;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            color: white !important;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            color: white !important;
        }

        .btn-light {
            background: var(--bg-color) !important;
            color: var(--text-main) !important;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            filter: brightness(1.1);
        }

        .btn-sm {
            padding: 6px 12px !important;
            font-size: 0.85rem !important;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        /* Print Styles */
        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: var(--card-bg);
            }

            .main-card {
                box-shadow: none;
                border: none;
                padding: 0;
            }

            .workers-table {
                border: 1px solid #000;
            }

            .workers-table th,
            .workers-table td {
                border: 1px solid #000;
            }
        }
    </style>
    <script>Auth.checkAuth();</script>
</head>

<body>

    <div id="navbar-container"></div>
    <script src="../assets/js/react-polyfills.js"></script>
    <script src="../assets/js/react.production.min.js"></script>
    <script src="../assets/js/react-dom.production.min.js"></script>
    <script src="../assets/js/navbar_manager.js"></script>

    <div class="container animate-fade-in-up">
        <div class="header-section text-center mb-4">
            <h2><i class="fas fa-users-cog"></i> إدارة العمال</h2>
            <p>إدارة سجلات العمال المهنيين وسائقي السيارات والحجاب</p>
        </div>

        <!-- Stats Row -->
        <div class="stats-row no-print" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
            <div class="stat-card" style="padding: 15px;">
                <div class="stat-icon-wrapper">
                    <i class="fas fa-users-cog"></i>
                </div>
                <div class="stat-info">
                    <span class="number" id="totalWorkers">0</span>
                    <span class="label">الإجمالي</span>
                </div>
            </div>
            <!-- 1. العمال المهنيين -->
            <div class="stat-card" style="padding: 15px;">
                <div class="stat-icon-wrapper" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6;">
                    <i class="fas fa-tools"></i>
                </div>
                <div class="stat-info">
                    <span class="number" id="countCategory1">0</span>
                    <span class="label" style="font-size: 0.8rem">عمال مهنيون</span>
                </div>
            </div>
            <!-- 2. أعوان الخدمة -->
            <div class="stat-card" style="padding: 15px;">
                <div class="stat-icon-wrapper" style="background: rgba(16, 185, 129, 0.1); color: #10b981;">
                    <i class="fas fa-concierge-bell"></i>
                </div>
                <div class="stat-info">
                    <span class="number" id="countCategory2">0</span>
                    <span class="label" style="font-size: 0.8rem">أعوان خدمة</span>
                </div>
            </div>
            <!-- 3. أعوان الوقاية والحراس -->
            <div class="stat-card" style="padding: 15px;">
                <div class="stat-icon-wrapper" style="background: rgba(245, 158, 11, 0.1); color: #f59e0b;">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div class="stat-info">
                    <span class="number" id="countCategory3">0</span>
                    <span class="label" style="font-size: 0.8rem">وقاية وحراس</span>
                </div>
            </div>
            <!-- 4. سائقي السيارات -->
            <div class="stat-card" style="padding: 15px;">
                <div class="stat-icon-wrapper" style="background: rgba(236, 72, 153, 0.1); color: #ec4899;">
                    <i class="fas fa-car"></i>
                </div>
                <div class="stat-info">
                    <span class="number" id="countCategory4">0</span>
                    <span class="label" style="font-size: 0.8rem">سائقون</span>
                </div>
            </div>
        </div>

        <!-- Top Bar Buttons -->
        <div class="top-bar-buttons mb-4 no-print"
            style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; padding: 15px; background: rgba(255,255,255,0.4); border-radius: 15px;">
            <button class="btn btn-success" onclick="openAddModal()">
                <i class="fas fa-plus-circle"></i> إضافة عامل
            </button>
            <button class="btn btn-primary" onclick="printWorkers()">
                <i class="fas fa-print"></i> طباعة القائمة
            </button>
        </div>

        <!-- Search -->
        <div class="search-filter-row no-print">
            <div class="search-box">
                <i class="fas fa-search"
                    style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
                <input type="text" id="searchInput" placeholder="بحث بالاسم أو الرتبة..." onkeyup="renderTable()">
            </div>
        </div>

        <!-- Table Container -->
        <div id="tableContainer">
            <!-- Dynamically populated -->
        </div>
    </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="workerModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-users-cog"></i> إضافة عامل</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="workerForm" onsubmit="saveWorker(event); return false;">
                <input type="hidden" id="editWorkerId">
                <div class="modal-body">
                    <div class="form-group-custom">
                        <label><i class="fas fa-signature" style="color: #94a3b8; margin-left: 8px;"></i> اللقب <span
                                style="color: #ef4444;">*</span></label>
                        <input type="text" id="inputLastName" required placeholder="أدخل اللقب">
                    </div>
                    <div class="form-group-custom">
                        <label><i class="fas fa-user" style="color: #94a3b8; margin-left: 8px;"></i> الاسم <span
                                style="color: #ef4444;">*</span></label>
                        <input type="text" id="inputFirstName" required placeholder="أدخل الاسم">
                    </div>
                    <div class="form-group-custom">
                        <label><i class="fas fa-id-badge" style="color: #94a3b8; margin-left: 8px;"></i> الرمز
                            الوظيفي</label>
                        <input type="text" id="inputJobCode" placeholder="أدخل الرمز الوظيفي">
                    </div>
                    <div class="form-group-custom">
                        <label><i class="fas fa-calendar-alt" style="color: #94a3b8; margin-left: 8px;"></i> تاريخ
                            الميلاد</label>
                        <input type="date" id="inputDob">
                    </div>
                    <div class="form-group-custom">
                        <label><i class="fas fa-layer-group" style="color: #94a3b8; margin-left: 8px;"></i>
                            الدرجة</label>
                        <input type="text" id="inputGrade" placeholder="مثال: 1، 2، 3...">
                    </div>
                    <div class="form-group-custom">
                        <label><i class="fas fa-calendar-check" style="color: #94a3b8; margin-left: 8px;"></i> تاريخ
                            السريان</label>
                        <input type="date" id="inputEffectiveDate">
                    </div>
                    <div class="form-group-custom">
                        <label><i class="fas fa-briefcase" style="color: #94a3b8; margin-left: 8px;"></i> الرتبة <span
                                style="color: #ef4444;">*</span></label>
                        <select id="inputRank" class="form-select" required onchange="handleRankSelection()">
                            <option value="" disabled selected>اختر الرتبة...</option>
                            <optgroup label="العمال المهنيين">
                                <option value="عامل مهني خارج الصنف">عامل مهني خارج الصنف</option>
                                <option value="عامل مهني من الصنف الأول">عامل مهني من الصنف الأول</option>
                                <option value="عامل مهني من الصنف الثاني">عامل مهني من الصنف الثاني</option>
                                <option value="عامل مهني من الصنف الثالث">عامل مهني من الصنف الثالث</option>
                                <option value="عامل مهني من المستوى الرابع">عامل مهني من المستوى الرابع</option>
                                <option value="عامل مهني من المستوى الثالث">عامل مهني من المستوى الثالث</option>
                                <option value="عامل مهني من المستوى الثاني">عامل مهني من المستوى الثاني</option>
                                <option value="عامل مهني من المستوى الأول">عامل مهني من المستوى الأول</option>
                            </optgroup>
                            <optgroup label="أعوان الخدمة">
                                <option value="عون الخدمة من المستوى الثالث">عون الخدمة من المستوى الثالث</option>
                                <option value="عون الخدمة من المستوى الثاني">عون الخدمة من المستوى الثاني</option>
                                <option value="عون الخدمة من المستوى الأول">عون الخدمة من المستوى الأول</option>
                            </optgroup>
                            <optgroup label="أعوان الوقاية والحراس">
                                <option value="عون الوقاية من المستوى الثاني">عون الوقاية من المستوى الثاني</option>
                                <option value="عون الوقاية من المستوى الأول">عون الوقاية من المستوى الأول</option>
                                <option value="حارس">حارس</option>
                            </optgroup>
                            <optgroup label="سائقي السيارات">
                                <option value="سائق سيارة من الصنف الأول">سائق سيارة من الصنف الأول</option>
                                <option value="سائق سيارة من الصنف الثاني">سائق سيارة من الصنف الثاني</option>
                                <option value="سائق سيارة من المستوى الثالث ورئيس حظيرة">سائق سيارة من المستوى الثالث
                                    ورئيس حظيرة</option>
                                <option value="سائق سيارة من المستوى الثاني">سائق سيارة من المستوى الثاني</option>
                                <option value="سائق سيارة من المستوى الأول">سائق سيارة من المستوى الأول</option>
                            </optgroup>
                            <optgroup label="أخرى">
                                <option value="other">أخرى... (إدخال يدوي)</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group-custom" id="customRankGroup" style="display: none; margin-top: -10px;">
                        <input type="text" id="inputCustomRank" placeholder="يرجى كتابة الرتبة هنا...">
                    </div>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-light" onclick="closeModal()">إلغاء</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> حفظ
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i> تأكيد الحذف</h3>
                <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
            </div>
            <div class="modal-body" style="text-align: center;">
                <p style="font-size: 1.1rem; font-weight: 600; color: var(--primary-color);">
                    هل أنت متأكد من حذف <strong id="deleteTargetName"></strong>؟
                </p>
                <p style="color: var(--text-muted); font-size: 0.9rem;">لا يمكن التراجع عن هذا الإجراء.</p>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn btn-light" onclick="closeDeleteModal()">إلغاء</button>
                <button type="button" class="btn btn-danger" onclick="confirmDelete()">
                    <i class="fas fa-trash-alt"></i> حذف
                </button>
            </div>
        </div>
    </div>

    <script src="workers.js"></script>
    <script src="../assets/js/navbar_fix.js"></script>
    <script src="../assets/js/fullscreen_toggle.js"></script>
</body>

</html>

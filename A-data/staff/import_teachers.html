<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استيراد البيانات - تحليل النتائج</title>
    <!-- SheetJS for Excel processing -->
    <script>
        if (typeof module === 'object') {
            window.module = module;
            module = undefined;
        }
        if (typeof exports === 'object') {
            window.exports = exports;
            exports = undefined;
        }
    </script>
    <script src="../assets/js/xlsx.full.min.js"></script>
    <script>
        if (window.module) module = window.module;
        if (window.exports) exports = window.exports;
    </script>
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style.css">
    <script src="../db.js"></script>
    <script src="../auth.js"></script>
    <script src="../assets/js/icon_manager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof IconManager !== 'undefined') IconManager.render();
        });
    </script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --premium-dark: #0f172a;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            background: radial-gradient(circle at top right, #f8fafc, #f1f5f9);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            transition: background 0.3s ease;
        }

        html[data-theme="dark"] body {
            background: radial-gradient(circle at top right, #0f172a, #020617);
            color: #e2e8f0;
        }

        .import-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            margin-top: 30px;
            animation: fadeIn 0.6s ease-out;
        }

        html[data-theme="dark"] .import-card {
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(51, 65, 85, 0.5);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-title {
            font-weight: 800;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: center;
        }

        html[data-theme="dark"] .page-title {
            background: linear-gradient(135deg, #e2e8f0, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
        }

        html[data-theme="dark"] .upload-area {
            border-color: #334155;
            background: rgba(15, 23, 42, 0.4);
        }

        .upload-area:hover {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.05);
            transform: translateY(-2px);
        }

        html[data-theme="dark"] .upload-area:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
        }

        .upload-area.dragover {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.05);
        }

        .upload-icon {
            font-size: 3.5rem;
            color: var(--accent-blue);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .upload-text h3 {
            font-weight: 700;
            color: var(--premium-dark);
            margin-bottom: 10px;
        }

        html[data-theme="dark"] .upload-text h3 {
            color: #f1f5f9;
        }

        .upload-text p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .btn-select-file {
            margin-top: 20px;
            background: var(--accent-blue);
            color: white;
            padding: 10px 25px;
            border-radius: 12px;
            font-weight: 700;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-select-file:hover {
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
            filter: brightness(1.1);
        }

        .import-settings {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        html[data-theme="dark"] .import-settings {
            background: rgba(30, 41, 59, 0.4);
            border-color: #334155;
        }

        .import-settings h4 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--premium-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        html[data-theme="dark"] .import-settings h4 {
            color: #cbd5e1;
        }

        .mode-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .mode-option {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        html[data-theme="dark"] .mode-option {
            border-color: #334155;
            background: rgba(15, 23, 42, 0.3);
        }

        .mode-option:hover {
            border-color: var(--accent-blue);
        }

        .mode-option.active {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.05);
        }

        html[data-theme="dark"] .mode-option.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
        }

        .mode-option i {
            font-size: 1.2rem;
            margin-bottom: 8px;
            display: block;
        }

        .mode-option .title {
            font-weight: 700;
            font-size: 0.95rem;
            display: block;
        }

        .mode-option .desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .log-container {
            background: var(--premium-dark);
            border-radius: 18px;
            padding: 20px;
            color: var(--border-color);
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            max-height: 250px;
            overflow-y: auto;
            text-align: right;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        html[data-theme="dark"] .log-container {
            background: #020617;
            border-color: #1e293b;
        }

        .log-entry {
            margin-bottom: 6px;
        }

        .log-info { color: #60a5fa; }
        .log-success { color: #4ade80; }
        .log-warning { color: #fbbf24; }
        .log-error { color: #f87171; }

        .progress-container {
            height: 10px;
            background: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
            display: none;
        }

        html[data-theme="dark"] .progress-container {
            background: #1e293b;
        }

        .progress-bar {
            height: 100% !important;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            width: 0%;
            transition: width 0.3s ease;
        }

        .no-file-selected {
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-process {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #2563eb, #2563eb);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-process:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.25);
        }

        .btn-process:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        html[data-theme="dark"] .btn-process:disabled {
            background: #334155;
            color: #64748b;
        }
    </style>
    <script>Auth.checkAuth();</script>
</head>

<body>
    <div id="navbar-container"></div>
    <script src="../assets/js/react-polyfills.js"></script>
    <script src="../assets/js/react.production.min.js"></script>
    <script src="../assets/js/react-dom.production.min.js"></script>
    <script src="../assets/js/navbar_manager.js"></script>

    <div class="container pb-5">
        <div class="import-card">
            <h1 class="page-title">
                <i class="fas fa-file-import"></i>
                استيراد البيانات
            </h1>

            <!-- Settings -->
            <div class="import-settings">
                <h4><i class="fas fa-cog"></i> خيارات الاستيراد</h4>
                <div class="mode-selection">
                    <div class="mode-option active" id="modeUpdate" onclick="setImportMode('update')">
                        <i class="fas fa-layer-group text-primary"></i>
                        <span class="title">دمج وتحديث</span>
                        <span class="desc">إضافة الأساتذة الجدد للقائمة الحالية مع تجنب التكرار</span>
                    </div>
                    <div class="mode-option" id="modeReplace" onclick="setImportMode('replace')">
                        <i class="fas fa-trash-alt text-danger"></i>
                        <span class="title">حذف واستبدال</span>
                        <span class="desc">مسح قائمة الأساتذة الحالية تماماً واستبدالها بالملف الجديد</span>
                    </div>
                </div>
            </div>

            <!-- Upload Area -->
            <div class="upload-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept=".xls,.xlsx" style="display: none;"
                    onchange="handleFileSelect(event)">
                <div class="upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <div class="upload-text">
                    <h3>اسحب وأفلت الملف هنا</h3>
                    <p>يدعم ملفات Excel بصيغة (.xls أو .xlsx)</p>
                </div>
                <button class="btn-select-file">أو اختر ملفاً من جهازك</button>
            </div>

            <!-- Progress & Logs -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div id="processContainer" class="no-file-selected">
                <button class="btn-process" id="btnProcess" onclick="processFile()">
                    <i class="fas fa-play-circle me-2"></i>
                    بدء عملية المعالجة والاستيراد
                </button>
            </div>

            <div class="log-container mt-4" id="logArea">
                <div class="log-entry log-info">بانتظار اختيار الملف لبدء العملية...</div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-body text-center p-5">
                    <div class="text-success mb-4" style="font-size: 4rem;">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h2 class="fw-bold mb-3">تم الاستيراد بنجاح!</h2>
                    <p class="text-muted mb-4" id="successMsg"></p>
                    <button class="btn btn-primary w-100 py-3" style="border-radius: 12px; font-weight: 700;"
                        onclick="window.location.href='teachers.html'">
                        العودة لقائمة الأساتذة
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/sweetalert2.all.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="import_teachers.js"></script>
</body>

</html>
